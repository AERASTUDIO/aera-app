.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.today{font-family:var(--f-label);font-size:13px;color:var(--muted);letter-spacing:0;text-transform:none}
.viewtitle{font-family:var(--f-label);font-weight:600;font-size:15px;letter-spacing:0;text-transform:none;color:var(--muted);margin:22px 0 10px}
h2.big{font-size:26px;line-height:1.15;margin:18px 0 4px;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.row{display:flex;gap:12px;align-items:flex-start}
.date{flex:none;width:52px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date b{display:block;font-size:24px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.date small{display:block;font-family:var(--f-label);text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted);margin-top:4px}
.grow{flex:1;min-width:0}
.t{font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;color:var(--muted);font-size:13px;align-items:center}
.nr{font-family:var(--f-mono);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:0;padding:3px 9px;border-radius:999px;background:var(--gray-soft);color:var(--muted);white-space:nowrap}
.pill{background:var(--b0);color:var(--t0)} .pill.l1{background:var(--b1);color:var(--t1)} .pill.l2{background:var(--b2);color:var(--t2)}
.pill.l3{background:var(--b3);color:var(--t3)} .pill.l4{background:var(--b4);color:var(--t4)}
.kind{font-family:var(--f-label);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:13.5px;letter-spacing:0;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:13.5px}
.kv dt{font-family:var(--f-label);color:var(--muted);text-transform:none;letter-spacing:0;font-size:13px;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.summary{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:13.5px}
.subs{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.sub-i{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
.sub-i a{color:var(--ink);text-decoration:none;min-width:0;overflow-wrap:anywhere}
details.card>summary{list-style:none;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
.chev{transition:transform .2s;color:var(--muted);flex:none}
details[open] .chev{transform:rotate(90deg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis .card b{display:block;font-size:30px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpis .card span{font-family:var(--f-label);font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted)}
.kpis .card.alert b{color:var(--crit)}
.bar{height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--gray-soft);margin-top:10px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--c)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;font-family:var(--f-label);letter-spacing:0}
nav.mbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.mbtn{appearance:none;display:flex;align-items:center;gap:10px;width:100%;max-width:528px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 14px;font:600 15px var(--f-label);cursor:pointer;text-align:left}
.mbtn svg{width:22px;height:22px;flex:none;color:var(--accent)}
.mbtn .mlab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn .mhint{font:500 13px var(--f-label);color:var(--muted)}
.mbtn .up{color:var(--muted);transition:transform .2s}
.mbtn[aria-expanded="true"] .up{transform:rotate(180deg)}
#menuwrap .scrim{z-index:7}
.mpanel{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:8;max-width:560px;margin:0 auto;padding:0 16px}
.mpanel .in{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 140px);overflow:auto}
.tab{appearance:none;border:0;background:none;color:var(--ink);font:500 15.5px var(--f-label);display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;border-radius:12px;text-align:left;width:100%}
.tab svg{width:22px;height:22px;flex:none;color:var(--muted)}
.tab .tl{flex:1}
.tab .tc{font:500 13px var(--f-label);color:var(--muted);font-variant-numeric:tabular-nums}
.tab:active{background:var(--b0)}
.cal-head{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.cal-head h2{flex:1;margin:0;font-size:22px;font-weight:600}
.iconbtn{appearance:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.cal .dow{text-align:center;font:500 12px var(--f-label);color:var(--muted);padding:2px 0 4px}

  const dropTimes=(s,pred)=>{T(s); const gone=entries(s).filter(pred); const seen=new Set();
    gone.forEach(e=>{if(seen.has(e.id)) return; seen.add(e.id); const t=+e.timar||0, p=sFindP(s,e.verkefniId), u=e.undirverkId?sFindU(s,e.undirverkId)[1]:null;
      if(p) p.timar=Math.max(0,(p.timar||0)-t); if(u) u.timar=Math.max(0,(u.timar||0)-t); s.timar.samtals=Math.max(0,(s.timar.samtals||0)-t);
      if(s.timar.timabil&&(e.timabil||timabilOf(e.date))===s.timar.timabil) s.timar.timabilSamtals=Math.max(0,(s.timar.timabilSamtals||0)-t);});
    if(s.timar.faerslur) s.timar.faerslur=s.timar.faerslur.filter(e=>!pred(e)); if(s.timar.nyjast) s.timar.nyjast=s.timar.nyjast.filter(e=>!pred(e)); return seen.size;};
  let label="", q="", mut=null;
  if(type==="verk"){const p=findProj(id); if(!p) return; const nu=(p.undirverk||[]).length, nt=faerslur().filter(e=>e.verkefniId===id).length;
    label=p.nafn; q=`Eyða verkefninu „${p.nafn}“?`+(nu||nt?`\n\nÞví fylgja ${nu} undirverk og ${nt} tímaskráningar sem eyðast líka.`:"")+`\nFundir og skjöl haldast en tengjast ekki lengur verkefninu.`;
    mut=s=>{dropTimes(s,e=>e.verkefniId===id); s.verkefni=(s.verkefni||[]).filter(x=>x.id!==id);
      (s.fundir||[]).forEach(f=>{if(f.projectId===id){f.projectId=null;}}); (s.skjol||[]).forEach(x=>{if(x.projectId===id) x.projectId=null;});};}

    q=`Eyða „${c.name}“ úr viðskiptavinum?`+(n?`\n\n${n} verkefni tengjast fyrirtækinu. Þau haldast en tengingin fellur niður.`:"");

    return `<a class="lrow fl" href="${esc(odUrl(parts.concat(it.n),isF))}" target="_blank" rel="noopener"><div class="lm"><div class="lt">${isF?"":"📁 "}${esc(it.n)}</div><div class="ls">${esc([isF?(ODTYPE[ext]||ext.toUpperCase()):"Mappa",kb(it.s)].join(" · "))}</div></div><div class="lr"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></div></a>`;};
  const rows=(m.atridi||[]).map(d=>{const parts=[m.k,d.n], has=d.s>0;
    return `<details class="fold"${has&&/^0[478]/.test(d.n)?" open":""}><summary class="lrow"><div class="lm"><div class="lt"${has?"":' style="color:var(--muted)"'}>${esc(d.n)}</div><div class="ls">${esc(has?kb(d.s)+(d.i?` · ${d.i.length} ${d.i.length===1?"atriði":"atriði"}`:""):"Tóm mappa")}</div></div>
      ${has?`<a class="plink" href="${esc(odUrl(parts))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Opna</a>`:""}</summary>
      ${d.i&&d.i.length?`<div class="fitems">${d.i.map(it=>item(parts,it)).join("")}</div>`:has?`<div class="fitems"><div class="ls" style="padding:8px 0">Opnaðu möppuna til að sjá innihaldið.</div></div>`:""}</details>`;}).join("");
  return `<div class="viewtitle" style="display:flex;justify-content:space-between;gap:8px"><span>Skrár í OneDrive</span><a class="plink" href="${esc(odUrl([m.k]))}" target="_blank" rel="noopener">Opna möppu</a></div>
  <div class="llist">${rows}</div><p class="hint" style="margin-top:8px">Listi síðast uppfærður ${esc(fmtDate(SK.uppfaert))}. Biddu Claude að „uppfæra skráalistann“ til að fá nýjar skrár.</p>`;
}
window.aeraStart=function(db){
  DB=db; MCP={local:true}; document.getElementById("syncbtn").hidden=false; document.getElementById("logoutbtn").hidden=false; document.getElementById("fab").hidden=false;
  db.watch("app/skrar",s=>{SK=s.exists?s.data():null; if(S) render();},()=>{});
  db.watch("app/state",s=>{PENDING=!!s.pending; if(s.exists){const nd=s.data(); if(JSON.stringify(nd)!==JSON.stringify(S)){S=nd; render();} else drawSync();} else if(!s.fromCache) importView();},
    e=>{document.getElementById("view").innerHTML=`<h2 class="big">Gögn ekki aðgengileg</h2><div class="empty">${esc(e?.code==="permission-denied"?"Þessi aðgangur hefur ekki leyfi til að lesa gögnin.":(e?.message||"Óþekkt villa"))}</div>`;});
};
document.getElementById("fab").hidden=true;
</script>
