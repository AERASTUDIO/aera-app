.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.today{font-family:var(--f-label);font-size:13px;color:var(--muted);letter-spacing:0;text-transform:none}
.viewtitle{font-family:var(--f-label);font-weight:600;font-size:15px;letter-spacing:0;text-transform:none;color:var(--muted);margin:22px 0 10px}
h2.big{font-size:26px;line-height:1.15;margin:18px 0 4px;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.row{display:flex;gap:12px;align-items:flex-start}
.date{flex:none;width:52px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date b{display:block;font-size:24px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.date small{display:block;font-family:var(--f-label);text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted);margin-top:4px}
.grow{flex:1;min-width:0}
.t{font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;color:var(--muted);font-size:13px;align-items:center}
.nr{font-family:var(--f-mono);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:0;padding:3px 9px;border-radius:999px;background:var(--gray-soft);color:var(--muted);white-space:nowrap}
.pill{background:var(--b0);color:var(--t0)} .pill.l1{background:var(--b1);color:var(--t1)} .pill.l2{background:var(--b2);color:var(--t2)}
.pill.l3{background:var(--b3);color:var(--t3)} .pill.l4{background:var(--b4);color:var(--t4)}
.kind{font-family:var(--f-label);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:13.5px;letter-spacing:0;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;font-size:13.5px}
.kv dt{font-family:var(--f-label);color:var(--muted);text-transform:none;letter-spacing:0;font-size:13px;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.summary{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:13.5px}
.subs{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.sub-i{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
.sub-i a{color:var(--ink);text-decoration:none;min-width:0;overflow-wrap:anywhere}
details.card>summary{list-style:none;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
.chev{transition:transform .2s;color:var(--muted);flex:none}
details[open] .chev{transform:rotate(90deg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis .card b{display:block;font-size:30px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpis .card span{font-family:var(--f-label);font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted)}
.kpis .card.alert b{color:var(--crit)}
.bar{height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--gray-soft);margin-top:10px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--c)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.foot{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;font-family:var(--f-label);letter-spacing:0}
nav.mbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.mbtn{appearance:none;display:flex;align-items:center;gap:10px;width:100%;max-width:528px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:10px 14px;font:600 15px var(--f-label);cursor:pointer;text-align:left}
.mbtn svg{width:22px;height:22px;flex:none;color:var(--accent)}
.mbtn .mlab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn .mhint{font:500 13px var(--f-label);color:var(--muted)}
.mbtn .up{color:var(--muted);transition:transform .2s}
.mbtn[aria-expanded="true"] .up{transform:rotate(180deg)}
#menuwrap .scrim{z-index:7}
.mpanel{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:8;max-width:560px;margin:0 auto;padding:0 16px}
.mpanel .in{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 140px);overflow:auto}
.tab{appearance:none;border:0;background:none;color:var(--ink);font:500 15.5px var(--f-label);display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;border-radius:12px;text-align:left;width:100%}
.tab svg{width:22px;height:22px;flex:none;color:var(--muted)}
.tab .tl{flex:1}
.tab .tc{font:500 13px var(--f-label);color:var(--muted);font-variant-numeric:tabular-nums}
.tab:active{background:var(--b0)}
.cal-head{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.cal-head h2{flex:1;margin:0;font-size:22px;font-weight:600}
.iconbtn{appearance:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.cal .dow{text-align:center;font:500 12px var(--f-label);color:var(--muted);padding:2px 0 4px}

  ["dagatal","Dagatal",IC('<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14" r=".6" fill="currentColor"/><circle cx="12" cy="14" r=".6" fill="currentColor"/><circle cx="15.5" cy="14" r=".6" fill="currentColor"/>')],
  ["verk","Verkefni",IC('<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>')],
  ["undir","Undirverk",IC('<path d="M4 6.5l1.6 1.6L8.5 5M4 12.5l1.6 1.6 2.9-3.1M4 18.5l1.6 1.6 2.9-3.1M11.5 7h8.5M11.5 13h8.5M11.5 19h8.5"/>')],

  ["timar","Tímaskráning",IC('<circle cx="12" cy="12.5" r="8"/><path d="M12 8v5l3 2M9.5 2.5h5"/>')],
  ["skjol","Skjöl",IC('<path d="M6.5 3.5h7l4.5 4.5v11a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 19V5a1.5 1.5 0 0 1 1.5-1.5z"/><path d="M13.5 3.5V8H18M8.5 12.5h7M8.5 16h7"/>')],

function d(iso){if(!iso) return null; const x=new Date(iso.length<=10?iso+"T00:00:00":iso); return isNaN(x)?null:x;}
function daysTo(iso){const x=d(iso); if(!x) return null; const y=new Date(x); y.setHours(0,0,0,0); return Math.round((y-today)/864e5);}
function rel(n){if(n===null) return ""; if(n===0) return "Í dag"; if(n===1) return "Á morgun"; if(n===-1) return "Í gær"; return n>0?"Eftir "+n+" daga":Math.abs(n)+" dögum liðið";}

  let t=rel(n); if(n>30){const x=new Date(today); x.setDate(x.getDate()+n); t=x.getDate()+". "+MON[x.getMonth()]+(x.getFullYear()!==today.getFullYear()?" "+x.getFullYear():"");}

function hhmm(iso){const x=d(iso); if(!x||!/T\d/.test(iso||"")) return ""; return pad(x.getHours())+":"+pad(x.getMinutes());}

  if(type==="verk"){const p=findProj(id); if(!p) return; title="Breyta verkefni";
    f=`<label>Heiti<input id="e-name" value="${esc(p.stutt)}" required></label><p class="hint">Verknúmerið <b class="nr">${esc(p.nr)}</b> helst óbreytt.</p>
    <label>Staða<select id="e-status">${PSTAT.map(s=>opt(s,s,p.stada)).join("")}</select></label>
    ${projFields("e",p)}
    <div><div class="kind" style="margin-bottom:6px">Þjónusta</div><div class="chips">${THJONUSTA.map(t=>`<label><input type="checkbox" name="thj" value="${t}"${p.thjonusta?.includes(t)?" checked":""}>${t}</label>`).join("")}</div></div>
    <label>Mappa (slóð)<input id="e-mappa" type="url" value="${esc(p.mappa||"")}" placeholder="https://…"></label>
    <label>Yfirlit<textarea id="e-yf">${esc(p.yfirlit||"")}</textarea></label>
    <div class="two"><label>Næst<input id="e-naest" value="${esc(p.naest||"")}"></label><label>Athuga<input id="e-ath" value="${esc(p.athuga||"")}"></label></div>
    <label>Teikningar frá<input id="e-tf" value="${esc(p.teikningarFra||"")}"></label>
    <label>Lýsing<textarea id="e-lys">${esc(p.lysing||"")}</textarea></label>`;}
  if(type==="vsk"){const c=findVsk(id); if(!c) return; title="Breyta viðskiptavini"; f=vskFormHTML("e",c);}
  if(type==="sub"){const r=findSub(id); if(!r) return; const u=r.u; title="Breyta undirverki";
    f=`<label>Heiti<input id="e-name" value="${esc(subName(u))}" required></label><p class="hint">Verknúmerið <b class="nr">${esc(u.nr)}</b> helst óbreytt.</p>
    <div class="two"><label>Staða<select id="e-status">${USTAT.map(s=>opt(s,STL[s],u.stada)).join("")}</select></label><label>Skiladagur<input id="e-date" type="date" value="${dOnly(u.skiladagur)}"></label></div>
    <label>Sérmappa (slóð)<input id="e-mappa" type="url" value="${esc(u.serMappa||"")}" placeholder="Tómt = mappa verkefnisins"></label>
    <label>Lýsing<textarea id="e-lys">${esc(u.lysing||"")}</textarea></label>`;}
  if(type==="fund"){const fd=findFund(id); if(!fd) return; const p=fundProj(fd); title="Breyta fundi";
    f=`<label>Heiti fundar<input id="e-name" value="${esc(fd.name)}" required></label>
    <div class="two"><label>Dagur<input id="e-date" type="date" value="${dOnly(fd.date)}" required></label><label>Klukkan<input id="e-time" type="text" inputmode="decimal" maxlength="5" placeholder="hh:mm" autocomplete="off" data-t24 value="${hhmm(fd.date)}"></label></div>
    <label>Staðsetning<input id="e-place" value="${esc(fd.stadsetning||"")}"></label>
    <label>Fundarhlekkur<input id="e-link" type="url" value="${esc(fd.fundarhlekkur||"")}" placeholder="https://… (ef fjarfundur)"></label>
    <label>Fundargerð (slóð)<input id="e-fg" type="url" value="${esc(fd.fundargerd||"")}" placeholder="https://… skjal í OneDrive"></label>
    <label>Verkefni<select id="e-proj"><option value="">Ekkert</option>${allProjOpts(p?.id)}</select></label>
    <label>Lýsing<textarea id="e-lys">${esc(fd.lysing||"")}</textarea></label>`;}
  if(type==="skjal"){const x=findSkjal(id); if(!x) return; title="Breyta skjali";
    f=`<label>Heiti skjals<input id="e-name" value="${esc(x.name||"")}" required></label>
    <div class="two"><label>Tegund<select id="e-type"><option value="">Engin</option>${DTYPES.map(t=>opt(t,t,x.tegund)).join("")}</select></label>
    <label>Staða<select id="e-status">${DSTAT.map(s=>opt(s,STL[s],x.stada||"Not started")).join("")}</select></label></div>
    <label>Verkefni<select id="e-proj"><option value="">Ekkert</option>${allProjOpts(x.projectId)}</select></label>
    <label>Efni<textarea id="e-lys">${esc(x.lysing||"")}</textarea></label>`;}
  if(type==="time"){const e=findTime(id); if(!e) return; title="Breyta tímaskráningu";
    f=`<label>Verkefni<select id="e-proj" required>${allProjOpts(e.verkefniId)}</select></label><label>Undirverk<select id="e-sub"></select></label>
    <label>Lýsing<input id="e-desc" value="${esc(cleanLys(e.lysing))}" required></label>
    <label>Dagsetning<input id="e-date" type="date" value="${dOnly(e.date)}" required></label>
    <div class="two"><label>Frá<input id="e-from" type="text" inputmode="decimal" maxlength="5" placeholder="hh:mm" autocomplete="off" data-t24 value="${esc(e.fra||"")}" required></label><label>Til<input id="e-to" type="text" inputmode="decimal" maxlength="5" placeholder="hh:mm" autocomplete="off" data-t24 value="${esc(e.til||"")}" required></label></div>`;}
  sheet.innerHTML=`<h3 id="sheet-h">${title}</h3><form id="editf" novalidate>${f}<div id="f-msg"></div><div class="actions"><button type="button" class="btn" id="e-cancel">Hætta við</button><button class="btn primary" id="e-save">Vista</button></div></form>`;
  sheetwrap.hidden=false; wireVskSelects(sheet);
  document.getElementById("e-cancel").onclick=closeSheet;
  if(type==="time"){const e=findTime(id); let sel=e.undirverkId; const ps=document.getElementById("e-proj");
    const fill=()=>{const p=findProj(ps.value); document.getElementById("e-sub").innerHTML=`<option value="">Ekkert</option>`+(p?.undirverk||[]).map(u=>opt(u.id,u.heiti,sel)).join("");};
    ps.onchange=()=>{sel=null;fill();}; fill();}
  document.getElementById("editf").onsubmit=ev=>{ev.preventDefault(); saveEdit(type,id);};
}
async function saveEdit(type,id){
  const btn=document.getElementById("e-save"); msg("");
  const busy=()=>{btn.disabled=true; btn.textContent="Vista…";};
  try{
    if(type==="verk"){const p=findProj(id); const name=val("e-name"), mp=val("e-mappa"); if(!name) return msg("Heiti vantar.","err"); if(!urlOk(mp)) return msg("Mappa þarf að vera slóð sem byrjar á https://","err");
      const D=readProjDates("e",p); const snap=D._snap; delete D._snap;
      const thj=[...document.querySelectorAll('#editf input[name="thj"]:checked')].map(i=>i.value), st=val("e-status");
      busy(); const cl=await pickVsk("e","client","Viðskiptavinur"), vk=await pickVsk("e","buyer","Verkkaupi");
      const props={"Name":p.nr+" "+name,"Staða":st,"Þjónusta":thj,"Mappa":mp||null,...D,
        "Viðskiptavinur (fyrirtæki)":cl?[cl.id]:[],"Verkkaupi (fyrirtæki)":vk?[vk.id]:[],
        "Viðskiptavinur":legacySel(cl,["Sonik"]),"Verkkaupi":legacySel(vk,VERKKAUPAR)};
      await updatePage(id,props);
      const extra={vskId:cl?.id||null,vkId:vk?.id||null,...snap};
      await saveSnapshot(s=>{const q=sFindP(s,id); if(q) Object.assign(q,{stutt:name,nafn:p.nr+" "+name,stada:st,vidskiptavinur:cl?.name||null,verkkaupi:vk?.name||null,thjonusta:thj,mappa:mp||null,yfirlit:val("e-yf")||null,naest:val("e-naest")||null,athuga:val("e-ath")||null,teikningarFra:val("e-tf")||null,lysing:val("e-lys")||null,...extra});});
      patchLiveVerk(id,extra);
    }
    if(type==="vsk"){const old=findVsk(id); const {c,props}=readVskForm("e",true);
      const dup=vskList().find(x=>!sameId(x.id,id)&&x.name.toLowerCase()===c.name.toLowerCase()); if(dup) return msg(`${esc(dup.name)} er þegar á listanum.`,"err");
      busy(); await updatePage(id,props); patchLiveVsk({...old,...c,id:old.id});
      await saveSnapshot(s=>{const q=(s.vidskiptavinir||[]).find(x=>sameId(x.id,id)); if(q) Object.assign(q,c); else (s.vidskiptavinir=s.vidskiptavinir||[]).push({id:old.id,...c});});
    }
    if(type==="sub"){const {u,p}=findSub(id); const name=val("e-name"), mp=val("e-mappa"); if(!name) return msg("Heiti vantar.","err"); if(!urlOk(mp)) return msg("Sérmappa þarf að vera slóð sem byrjar á https://","err");
      const st=val("e-status"), dt=val("e-date"); const props={"Heiti":u.nr+" "+name,"Staða":st,"Sérmappa":mp||null};
      if(dt){props["date:Skiladagur:start"]=dt;props["date:Skiladagur:is_datetime"]=0;} else if(u.skiladagur) props["date:Skiladagur:start"]=null;
      busy(); await updatePage(id,props);
      await saveSnapshot(s=>{const [q,w]=sFindU(s,id); if(w) Object.assign(w,{heiti:u.nr+" "+name,stada:st,skiladagur:dt||null,serMappa:mp||null,mappa:mp||q?.mappa||null,lysing:val("e-lys")||null});});
    }
    if(type==="fund"){const name=val("e-name"),dt=val("e-date"),tm=val("e-time"),place=val("e-place"),link=val("e-link"),fg=val("e-fg"),pid=val("e-proj");
      if(!name||!dt) return msg("Heiti og dagur verða að vera útfyllt.","err"); if(!urlOk(link)||!urlOk(fg)) return msg("Slóðir þurfa að byrja á https://","err");
      const start=tm?dt+"T"+tm+":00":dt; const props={"Name":name,"date:Date:start":start,"date:Date:is_datetime":tm?1:0,"Staðsetning":place||null,"Fundarhlekkur":link||null,"Fundargerð slóð":fg||null,"Project":pid?[pid]:[]};
      busy(); await updatePage(id,props); const p=findProj(pid);
      await saveSnapshot(s=>{const q=(s.fundir||[]).find(x=>x.id===id); if(q) Object.assign(q,{name,date:start,stadsetning:place||null,fundarhlekkur:link||null,fundargerd:fg||null,projectId:pid||null,verknr:p?.nafn||null,mappa:p?.mappa||null,lysing:val("e-lys")||null});});
    }
    if(type==="skjal"){const name=val("e-name"),tp=val("e-type"),st=val("e-status"),pid=val("e-proj");
      if(!name) return msg("Heiti vantar.","err");
      busy(); await updatePage(id,{"Name":name,"Type":tp||null,"Status":st,"Project":pid?[pid]:[]});
      await saveSnapshot(s=>{const q=(s.skjol||[]).find(x=>x.id===id); if(q) Object.assign(q,{name,tegund:tp||null,stada:st,projectId:pid||null,lysing:val("e-lys")||null,breytt:new Date().toISOString()});});
      if(LIVE.skjol){const x=LIVE.skjol.find(x=>sameId(x.id,id)); if(x){Object.assign(x,{name,tegund:tp||null,stada:st,_proj:nid(pid)}); LIVE.v++;}}
    }
    if(type==="time"){const e=findTime(id); const pid=val("e-proj"),sid=val("e-sub"),desc=val("e-desc"),dt=val("e-date"),fr=val("e-from"),to=val("e-to");
      if(!pid||!desc||!dt||!fr||!to) return msg("Fylltu út verkefni, lýsingu, dagsetningu og tíma.","err");
      const t=hoursBetween(fr,to), lys=lysFmt(dt,desc,t);
      const props={"Lýsing":lys,"Tímar":t,"Verkefni":[pid],"Undirverk":sid?[sid]:[],"date:Dagsetning:start":dt+"T"+fr+":00","date:Dagsetning:end":endDayOf(dt,fr,to)+"T"+to+":00","date:Dagsetning:is_datetime":1};
      busy(); await updatePage(id,props); const old=+e.timar||0, diff=t-old;
      await saveSnapshot(s=>{const L=sTimes(s); const q=L.find(x=>x.id===id); const p=sFindP(s,pid), u=sid?sFindU(s,sid)[1]:null;
        const oP=sFindP(s,e.verkefniId), oU=e.undirverkId?sFindU(s,e.undirverkId)[1]:null; if(oP) oP.timar=(oP.timar||0)-old; if(oU) oU.timar=(oU.timar||0)-old;
        if(p) p.timar=(p.timar||0)+t; if(u) u.timar=(u.timar||0)+t; s.timar.samtals=(s.timar.samtals||0)+diff;
        if(s.timar.timabil){const was=(e.timabil||timabilOf(e.date))===s.timar.timabil, now=timabilOf(dt)===s.timar.timabil; s.timar.timabilSamtals=(s.timar.timabilSamtals||0)-(was?old:0)+(now?t:0);}
        if(q) Object.assign(q,{date:dt,lysing:lys,fra:fr,til:to,timar:t,verkefniId:pid,undirverkId:sid||null,nr:u?.nr||p?.nr,timabil:timabilOf(dt)});
        if(s.timar.faerslur) s.timar.nyjast=s.timar.faerslur.slice(0,10);});
    }
    toast("Breyting vistuð"); closeSheet(); setTimeout(loadLive,2500);
  }catch(e){btn.disabled=false; btn.textContent="Vista"; msg(esc(e?.code==="form"?e.message:errText(e)),"err");}
}


function syncNow(){
  if(!S) return; const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="aera-afrit-"+isoDay(new Date())+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast("Afrit vistað á tækinu");
}
function importView(){
  document.getElementById("view").innerHTML=`<h2 class="big">Engin gögn ennþá</h2><div class="empty" style="text-align:left">Veldu gagnaskrána (aera-gogn.json eða afrit) til að flytja gögnin inn.</div>
  <div class="links" style="margin-top:12px"><label class="btn primary" style="cursor:pointer">Flytja inn gögn<input type="file" id="imp" accept="application/json,.json" hidden></label></div><div id="imp-msg"></div>`;
  document.getElementById("imp").onchange=async ev=>{const f=ev.target.files[0]; if(!f) return; const out=document.getElementById("imp-msg");
    try{const d=JSON.parse(await f.text()); if(!Array.isArray(d.verkefni)) throw {message:"Þetta er ekki gagnaskrá appsins."};
      delete d._snid; d.uppfaert=new Date().toISOString(); S=d; render(); await DB.set("app/state",d); toast("Gögnin eru komin inn");}
    catch(e){out.innerHTML=`<div class="msg err">${esc(e?.message||"Gat ekki lesið skrána.")}</div>`;}};
}
render();
window.aeraStart=function(db){
  DB=db; MCP={local:true}; document.getElementById("syncbtn").hidden=false; document.getElementById("logoutbtn").hidden=false; document.getElementById("fab").hidden=false;
  db.watch("app/state",s=>{if(s.exists){S=s.data(); render();} else if(!s.fromCache) importView();},
    e=>{document.getElementById("view").innerHTML=`<h2 class="big">Gögn ekki aðgengileg</h2><div class="empty">${esc(e?.code==="permission-denied"?"Þessi aðgangur hefur ekki leyfi til að lesa gögnin.":(e?.message||"Óþekkt villa"))}</div>`;});
};
document.getElementById("fab").hidden=true;
</script>
